<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
    <defs>
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0f1d" />
            <stop offset="100%" stop-color="#070a14" />
        </linearGradient>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
            
            .bg { fill: url(#bg-grad); }
            .text-container { font-family: 'JetBrains Mono', monospace; font-size: 15px; fill: #e2e8f0; }
            
            /* Jeder Buchstabe fliegt einzeln rein */
            .letter {
                opacity: 0;
                transform-origin: 50% 50%;
                animation: floatIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            }

            .accent-blue { fill: #38bdf8; font-weight: bold; }
            .accent-green { fill: #34d399; font-weight: bold; }
            .accent-purple { fill: #a78bfa; font-weight: bold; }
            .dim { fill: #64748b; }

            @keyframes floatIn {
                0% { opacity: 0; transform: translateY(15px) scale(0.9); }
                100% { opacity: 1; transform: translateY(0) scale(1); }
            }
        </style>
    </defs>

    <rect width="100%" height="100%" class="bg" />

    <g class="text-container" transform="translate(60, 60)">
        <!-- Beispiel-Struktur für das Rendering -->
        <g class="letter accent-blue" style="animation-delay: 0.00s"><text x="0" y="0">T</text></g>
        <g class="letter accent-blue" style="animation-delay: 0.03s"><text x="9" y="0">I</text></g>
        <g class="letter accent-blue" style="animation-delay: 0.06s"><text x="18" y="0">W</text></g>
        <!-- ... Alle weiteren Buchstaben sind im generierten File perfekt positioniert ... -->
    </g>
</svg>
