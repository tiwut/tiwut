<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&amp;display=swap');
            
            .text-container {
                font-family: 'Poppins', sans-serif;
                font-size: 10rem;
                font-weight: 700;
                fill: #f0f0f0;
            }
            
            .letter {
                opacity: 0;
                transform-origin: bottom center;
                /* 'infinite' für den Loop, 'alternate' für fließendes Ein- und Ausblenden */
                animation: floatIn 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite alternate;
            }

            @keyframes floatIn {
                0% { opacity: 0; transform: translateY(60px) scale(0.7); }
                100% { opacity: 1; transform: translateY(0) scale(1); }
            }
        </style>
    </defs>

    <g class="text-container" transform="translate(50, 200)">
        <g class="letter" style="animation-delay: 0.0s"><text x="0">T</text></g>
        <g class="letter" style="animation-delay: 0.1s"><text x="95">i</text></g>
        <g class="letter" style="animation-delay: 0.2s"><text x="135">w</text></g>
        <g class="letter" style="animation-delay: 0.3s"><text x="270">u</text></g>
        <g class="letter" style="animation-delay: 0.4s"><text x="370">t</text></g>
    </g>
</svg>
